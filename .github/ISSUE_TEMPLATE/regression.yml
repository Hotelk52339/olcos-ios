name: Regression report
description: Something that previously worked in olcOS now fails.
title: "[regression]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Russian, English and French are welcome. A changed carrier or network can resemble an app regression; describe what you observed.
        **Report vulnerabilities privately** using [SECURITY.md](https://github.com/Hotelk52339/olcos-ios/blob/main/SECURITY.md).
        Never share credentials, complete connection/subscription links, QR codes, identifying logs or real IPs.
  - type: input
    id: current
    attributes:
      label: Current version and build
      placeholder: "1.0 (build 1), or exact tested build/commit"
    validations:
      required: true
  - type: input
    id: last_good
    attributes:
      label: Last known good version and build
      description: State unknown if you cannot identify it; do not invent a passing baseline.
    validations:
      required: true
  - type: input
    id: first_bad
    attributes:
      label: First known bad version and build
      description: State unknown if not isolated.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device, iOS, installation and signing
      description: Include what changed between builds. Signing type can be unknown; never provide Apple ID credentials or certificates.
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Selected mode
      options:
        - Automatic
        - VPN
        - SOCKS5
        - Unknown / not applicable
    validations:
      required: true
  - type: input
    id: backend
    attributes:
      label: Actual backend and fallback reason
      placeholder: "VPN / SOCKS5 / unknown; reason shown if relevant"
    validations:
      required: true
  - type: input
    id: carrier_transport
    attributes:
      label: WebRTC carrier and transport
      placeholder: "jitsi / datachannel, or unknown / not applicable"
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: App language
      options:
        - Russian (RU)
        - English (EN)
        - French (FR)
        - Unknown / not applicable
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction and comparison
      description: Same steps, expected result, actual result and frequency. State whether both builds were tested under comparable conditions; do not delete app data just to provide a baseline.
      placeholder: |
        Steps:
        Expected:
        Actual:
        What changed besides the app:
        Comparable baseline tested (yes/no/unknown):
    validations:
      required: true
  - type: textarea
    id: network
    attributes:
      label: Non-identifying network and lifecycle context
      description: Optional Wi-Fi/cellular, network switch, foreground return, lock/unlock, another VPN or DNS format. No real IPs or precise location required.
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or test evidence
      description: Include narrow time windows, OLC codes, commands and observed results if available. If logs cannot be shared safely, say so. Label mockups versus native screenshots.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I checked this report and its attachments for secrets, working links, QR codes and real IPs.
          required: true
        - label: I have marked unknowns and untested assumptions rather than claiming a verified baseline.
          required: true
