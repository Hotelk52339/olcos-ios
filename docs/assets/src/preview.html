<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>olcOS · concept preview source</title>
<!--
  Source of docs/assets/olcos-preview.png (?lang=ru) and olcos-preview-en.png
  (?lang=en): a hand-laid mockup of the three tabs using the app's current
  strings (App/Localization/L10nTable.swift), theme tokens (App/UI/Theme.swift)
  and the same hero scene the app draws (hero-scene.js, the study behind
  App/Views/FirewallArmorRenderer.swift). Demo data; not a native screenshot.
  Render with: node docs/assets/src/render.mjs
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&family=Inter:wght@400;500;600;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  /* Theme.Palette (dark) */
  --bg:#0B0C0F; --card:#17191D; --card-border:rgba(255,255,255,.07);
  --fill:rgba(255,255,255,.10); --fill-border:rgba(255,255,255,.14);
  --text:#FFFFFF; --text2:rgba(235,235,245,.60); --text3:rgba(235,235,245,.30);
  --accent:#4F5BD5; --green:#30D158; --red:#FF5F57;
  --signal:#5EAEFF; --cyan:#36D8F5; --violet:#8B7BFF;
  --sep:rgba(84,84,88,.55);
  --ui:Nunito,"Noto Sans",system-ui,sans-serif;   /* stands in for SF Rounded */
  --page:Inter,"Noto Sans",system-ui,sans-serif;
  --mono:"JetBrains Mono","DejaVu Sans Mono",monospace;
  --emoji:"Noto Color Emoji","Apple Color Emoji",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--page);-webkit-font-smoothing:antialiased}
.page{width:1248px;height:1064px;position:relative;overflow:hidden}
.page:before{content:"";position:absolute;inset:0;background:
  radial-gradient(60% 40% at 50% 62%,rgba(94,174,255,.10),rgba(11,12,15,0) 70%),
  radial-gradient(40% 30% at 22% 70%,rgba(139,123,255,.07),rgba(11,12,15,0) 70%),
  radial-gradient(40% 30% at 78% 70%,rgba(48,209,88,.06),rgba(11,12,15,0) 70%)}
.head{position:absolute;left:96px;top:56px;right:96px}
.eyebrow{font-size:13px;letter-spacing:.14em;color:var(--text2);font-weight:500;text-transform:uppercase}
.eyebrow span{margin:0 8px;color:var(--text3)}
h1{font-size:64px;line-height:1;margin:10px 0 12px;letter-spacing:-.045em;font-weight:800}
.tagline{font-size:20px;color:var(--text2);margin:0;font-weight:400}
.icon{position:absolute;right:0;top:4px;width:104px;height:104px;border-radius:24px;box-shadow:0 12px 32px rgba(0,0,0,.5)}

/* ---- phones ---- */
.phones{position:absolute;left:0;right:0;top:240px;display:flex;justify-content:center;align-items:flex-end;gap:36px}
.col{display:flex;flex-direction:column;align-items:center}
.col.mid{margin-bottom:26px}
.phone{width:308px;height:668px;background:#000;border-radius:52px;padding:9px;position:relative;
  box-shadow:0 0 0 1.5px #303238,0 0 0 3px #101114,0 40px 80px rgba(0,0,0,.65),0 10px 24px rgba(0,0,0,.5)}
.screen{position:relative;height:100%;background:var(--bg);border-radius:44px;overflow:hidden;font-family:var(--ui)}
.island{position:absolute;left:50%;top:11px;width:92px;height:26px;margin-left:-46px;background:#000;border-radius:14px;z-index:5}
.status{height:52px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 8px 32px;font-size:14px;font-weight:700}
.status .right{display:flex;gap:6px;align-items:center}
.status svg{display:block}
.nav{height:40px;display:flex;align-items:center;justify-content:center;position:relative;font-size:15px;font-weight:700;border-bottom:.5px solid rgba(255,255,255,.08);background:rgba(20,21,26,.9)}
.nav .plus{position:absolute;right:16px;top:8px;width:24px;height:24px;color:var(--signal);font-size:24px;line-height:22px;font-weight:500;text-align:center;font-family:var(--page)}
.body{padding:8px 16px 0;position:relative;height:calc(668px - 18px - 52px - 40px - 78px);overflow:hidden}
.body:after{content:"";position:absolute;left:0;right:0;bottom:0;height:40px;background:linear-gradient(rgba(11,12,15,0),var(--bg))}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:78px;border-top:.5px solid rgba(255,255,255,.10);background:rgba(20,21,26,.92);display:flex;justify-content:space-around;align-items:flex-start;padding:7px 8px 0}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:9.5px;color:rgba(235,235,245,.42);font-weight:600;width:90px}
.tab svg{width:26px;height:26px}
.tab.on{color:var(--signal)}

/* ---- shared UI ---- */
.card{background:var(--card);border:1px solid var(--card-border);border-radius:17px;padding:13px 14px}
.h2{font-size:14.5px;font-weight:700;margin:16px 0 8px 2px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:.5px solid var(--sep);font-size:13px;font-weight:500}
.row .t.nw{white-space:nowrap}
.row:first-child{border-top:0}
.row .t{font-weight:600}
.row .s{font-size:10.5px;color:var(--text2);margin-top:2px;font-weight:500}
.row .mono{font-family:var(--mono);font-size:11px;color:var(--text2)}
.chev{color:var(--text3);font-size:15px;font-weight:700;margin-left:6px;line-height:1}
.value{color:var(--text2);display:flex;align-items:center;gap:4px;text-align:right;font-weight:500;font-size:12px;line-height:1.25}
.updown{width:10px;height:14px;color:var(--text3)}
.chip{font-size:10px;font-weight:700;padding:4px 8px;border-radius:8px;background:var(--fill);border:1px solid var(--fill-border);color:var(--text2);white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.chip.ok{color:var(--green);background:rgba(48,209,88,.12);border-color:rgba(48,209,88,.22)}
.chip i{width:6px;height:6px;border-radius:3px;background:currentColor;display:inline-block}
.btn{height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13.5px;font-weight:700;background:var(--fill);border:1px solid var(--fill-border);color:var(--signal)}
.btn svg{width:15px;height:15px}
.toggle{width:42px;height:26px;border-radius:13px;background:var(--green);position:relative;flex:none}
.toggle:after{content:"";position:absolute;right:2px;top:2px;width:22px;height:22px;border-radius:11px;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.35)}
.toggle.off{background:rgba(120,120,128,.36)}
.toggle.off:after{right:auto;left:2px}
.more{width:24px;height:24px;border-radius:12px;border:1.5px solid var(--text2);display:grid;place-items:center;color:var(--text2);font-size:12px;letter-spacing:.5px;line-height:1;padding-bottom:5px;flex:none}
.link{color:var(--signal);font-weight:700}
.glyph{width:18px;height:18px;color:var(--text2);flex:none}
.lead{display:flex;align-items:center;gap:10px}

/* ---- Connections ---- */
.hero{text-align:center;padding-top:14px}
.state{font-size:29px;font-weight:800;letter-spacing:-.01em;line-height:1.1}
.evidence{font-size:11px;font-weight:600;color:var(--green);margin-top:8px}
.evidence .flag{font-family:var(--emoji);margin-right:3px}
canvas.pic{display:block;width:276px;height:170px;margin:2px -4px 4px}
.plate{margin-top:16px;text-align:left;display:flex;justify-content:space-between;align-items:flex-start}
.plate .svc{font-size:16px;font-weight:600}
.plate .sub{font-size:13px;color:var(--text2);margin-top:3px;font-weight:500}
.plate .sub b{font-weight:700}
.plate .sub em{font-style:normal;color:var(--text3)}
.plate .scope{font-size:10.5px;color:var(--text2);margin-top:9px;font-weight:500}

/* ---- Servers ---- */
.host{padding:10px 2px 12px;display:flex;justify-content:space-between;align-items:flex-start}
.host .name{font-size:19px;font-weight:700}
.host .name .flag{font-family:var(--emoji);font-size:15px;margin-left:4px}
.host .ssh{font-family:var(--mono);font-size:10.5px;color:var(--text2);margin-top:3px}
.host .machine{font-size:10.5px;color:var(--text2);margin-top:3px;font-weight:500}
.headline{display:flex;gap:10px;align-items:flex-start}
.headline svg{width:20px;height:20px;flex:none;margin-top:1px}
.headline .h{font-size:15px;font-weight:700}
.headline .d{white-space:nowrap;font-size:10.5px;color:var(--text2);margin-top:2px;font-weight:500}
.protoHead{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:.5px solid var(--sep)}
.protoHead .t{font-size:14.5px;font-weight:700}
.protoHead .add{font-size:12.5px;display:flex;align-items:center;gap:6px}
.protoHead .add svg{width:15px;height:15px}
.proto{padding:9px 0;border-top:.5px solid var(--sep)}
.proto .top{display:flex;justify-content:space-between;align-items:center}
.proto .n{font-size:14px;font-weight:600}
.proto .tr{font-size:10.5px;color:var(--text2);margin-top:1px;font-weight:500}
.proto .bottom{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:10.5px;color:var(--text2);font-weight:500;white-space:nowrap}
.links{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding:0 2px;font-size:13px}

/* ---- captions ---- */
.caption{margin-top:22px;font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;display:flex;gap:12px;align-items:baseline;color:var(--text)}
.caption .n{color:var(--signal);font-weight:600;font-size:11.5px;letter-spacing:.1em}
.footer{position:absolute;left:96px;right:96px;bottom:30px;font-size:11.5px;letter-spacing:.12em;color:var(--text3);text-transform:uppercase;font-weight:500;text-align:center}
</style>
</head>
<body>
<div class="page" id="page">
  <div class="head">
    <div class="eyebrow">iOS client<span>/</span>powered by olcrtc</div>

        </span></div>
        <div class="nav"><span data-t="tabServers"></span><span class="plus">+</span></div>

          <div class="host">
            <div>

          <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3.2" height="4" rx=".8"/><rect x="4.5" y="4.8" width="3.2" height="6.2" rx=".8"/><rect x="9" y="2.4" width="3.2" height="8.6" rx=".8"/><rect x="13.5" y="0" width="3.2" height="11" rx=".8"/></svg>

        <div class="nav"><span data-t="tabConnections"></span><span class="plus">+</span></div>
        <div class="body">
          <div class="hero">
            <div class="state" data-t="stateConnected"></div>
            <div class="evidence"><span class="flag">🇳🇱</span><span data-t="evidence"></span></div>

    <!-- 03 Settings -->

      <div class="phone"><div class="screen">
        <div class="island"></div>
        <div class="status"><span>9:41</span><span class="right">
          <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3.2" height="4" rx=".8"/><rect x="4.5" y="4.8" width="3.2" height="6.2" rx=".8"/><rect x="9" y="2.4" width="3.2" height="8.6" rx=".8"/><rect x="13.5" y="0" width="3.2" height="11" rx=".8"/></svg>

        <div class="nav"><span data-t="tabSettings"></span></div>

            <div class="row"><span class="t nw" data-t="configModeSectionHeader"></span><span class="value"><span data-t="tunnelModeAutomatic" style="max-width:118px"></span><svg class="updown" viewBox="0 0 10 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5l3-3 3 3M2 9l3 3 3-3"/></svg></span></div>
